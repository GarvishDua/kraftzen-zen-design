<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="google-site-verification" content="pAuhzUDvSlG6PR7OvDkTaIP8cGqfdXT7rM9OHxCfgG4" />

    <!-- AdSense. The publisher id is public by design and ships in the HTML of
         every site running ads, so it is not a secret and does not belong in an
         env var. `async` keeps it off the critical path.

         This is global on purpose. Google verifies a site by finding this code,
         and their setup instructions say to put it in the head of every page.
         An earlier version injected it only on /blog routes to avoid serving
         inventory on thin pages. That was wrong: the tag being present is not
         the same as an ad rendering. Where ads actually appear is an Auto ads
         setting, and restricting the tag risks failing verification, which is
         the step that matters.

         /admin is the one exception, handled in src/components/site/AdSense.tsx,
         because ads shown to the signed-in owner are how accidental self clicks
         happen and self clicks are an automated permanent ban. -->
    <script
      async
      src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1631267597697170"
      crossorigin="anonymous"
    ></script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fonts load without blocking the first paint.
         A plain <link rel="stylesheet"> to Google Fonts is render blocking: the
         browser will not paint a single pixel until that round trip to a third
         party finishes, which on a slow phone is most of First Contentful Paint.
         Loading it as media="print" makes it non-blocking, then the onload
         switches it to all and the fonts apply. `display=swap` means text is
         readable in the fallback face until then, so nothing is invisible. -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap"
      />
    </noscript>

    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />

    <!-- Defaults. The Seo component overrides these per route for crawlers
