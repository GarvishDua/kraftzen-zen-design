<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FBF8F3" />
    <meta name="google-site-verification" content="pAuhzUDvSlG6PR7OvDkTaIP8cGqfdXT7rM9OHxCfgG4" />

    <!-- AdSense. The publisher id is public by design and ships in the HTML on
         every site running ads, so it is not a secret and does not belong in an
         env var. `async` keeps it off the critical path.

         This tag must be present for the site review. It does not place ads on
         its own: that happens when Auto ads is switched on in the dashboard.
         When you do, exclude /admin there, so ads never render in a tool you
         are signed into. Ads served to the site owner are how accidental self
         clicks happen, and self clicks are a permanent ban. -->
    <script
      async
      src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1631267597697170"
      crossorigin="anonymous"
    ></script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap"
    />

    />
